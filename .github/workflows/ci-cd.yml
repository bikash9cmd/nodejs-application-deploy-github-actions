name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Install and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start server and check response
        run: |
          PORT=8080 node index.js &
          sleep 2
          curl --fail --silent http://localhost:8080/ | grep "Hello from the server"

  docker:
    name: Build and publish Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t app:ci .

      - name: Smoke test container
        run: |
          docker run -d --name app -p 8080:8080 app:ci
          sleep 3
          curl --fail --silent http://localhost:8080/ | grep "Hello from the server"
          docker rm -f app

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag app:ci "$IMAGE:latest"
          docker tag app:ci "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
